name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Regression tests and source build
        run: bash scripts/test.sh
      - name: Build universal app and compile XIB resources
        run: |
          xcodebuild -project Alan.xcodeproj -scheme Alan -configuration Release \
            -derivedDataPath .build/DerivedData CODE_SIGNING_ALLOWED=NO \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO build
      - name: Package app
        run: |
          codesign --force --sign - .build/DerivedData/Build/Products/Release/Alan.app
          ditto -c -k --sequesterRsrc --keepParent \
            .build/DerivedData/Build/Products/Release/Alan.app .build/Alan.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Alan-macOS
          path: .build/Alan.zip
          retention-days: 14
